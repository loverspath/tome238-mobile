<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ToME 2.3.8-ah Mobile Terminal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#121214">

  <!-- Offline Xterm.js bundle -->
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
</head>
<body>
  <div id="app" class="docked-mode profile-full108">
    <!-- Top Bar -->
    <header id="top-bar">
      <div class="brand">
        <span class="logo">⚡ ToME</span>
        <span class="version">2.3.8-ah</span>
      </div>
      <div class="status-group">
        <span id="conn-status" class="status-indicator disconnected">Connecting...</span>
        <!-- Profile Switcher Pill -->
        <button id="btn-profile" class="top-btn pill-btn" title="Switch Keyboard Profile">⌨ PC 108 Key</button>
        <!-- Dock / Overlap Mode Toggle -->
        <button id="btn-dock" class="top-btn icon-btn" title="Toggle Dock / Overlap Mode">⇱ Dock</button>
        <!-- Keyboard Opacity Toggle -->
        <button id="btn-ghost" class="top-btn icon-btn" title="Toggle Keyboard Opacity">◧</button>
        <!-- Game Restart -->
        <button id="btn-restart" class="top-btn icon-btn" title="Restart Game">↺</button>
      </div>
    </header>

    <!-- Terminal View -->
    <main id="terminal-wrapper">
      <div id="terminal"></div>
    </main>

    <!-- Context Ribbon -->
    <nav id="ribbon-bar">
      <div class="ribbon-section fixed-left">
        <button class="ribbon-btn esc-btn" data-key="\e">⎋ Esc</button>
        <button class="ribbon-btn enter-btn" data-key="\n">⏎ Ret</button>
        <button class="ribbon-btn" data-key=" ">⎵ Spc</button>
        <button class="ribbon-btn" data-key="\t">⇥ Tab</button>
        <button class="ribbon-btn" data-key="\b">⌫ BS</button>
      </div>
      <div class="ribbon-divider"></div>
      <div class="ribbon-section scrollable" id="dynamic-ribbon">
        <button class="ribbon-btn macro-btn" data-key="R&\n">💤 Rest</button>
        <button class="ribbon-btn" data-key="i">🎒 Inven</button>
        <button class="ribbon-btn" data-key="m">✨ Magic</button>
        <button class="ribbon-btn" data-key="d">🗑 Drop</button>
        <button class="ribbon-btn" data-key="l">👁 Look</button>
        <button class="ribbon-btn" data-key="*">🎯 Target</button>
        <button class="ribbon-btn" data-key="f">🏹 Fire</button>
        <button class="ribbon-btn" data-key="g">✋ Pickup</button>
        <button class="ribbon-btn" data-key="w">⚔ Wield</button>
        <button class="ribbon-btn" data-key="q">🧪 Quaff</button>
        <button class="ribbon-btn" data-key="r">📜 Read</button>
        <button class="ribbon-btn" data-key="u">🪄 Use</button>
        <button class="ribbon-btn" data-key="M">🗺 Map</button>
      </div>
    </nav>

    <!-- Virtual Input Controller (Full 108 PC Keyboard with Layer Tabs) -->
    <section id="keyboard-panel">
      <!-- Injected by app.js -->
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
